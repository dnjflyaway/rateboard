<script>
const CURRENCIES = {
AUD:{name:"Australian Dollar",flag:"🇦🇺",symbol:"A$"}, USD:{name:"US Dollar",flag:"🇺🇸",symbol:"$"}, EUR:{name:"Euro",flag:"🇪🇺",symbol:"€"}, GBP:{name:"British Pound",flag:"🇬🇧",symbol:"£"}, NZD:{name:"New Zealand Dollar",flag:"🇳🇿",symbol:"NZ$"}, SGD:{name:"Singapore Dollar",flag:"🇸🇬",symbol:"S$"}, JPY:{name:"Japanese Yen",flag:"🇯🇵",symbol:"¥"}, CAD:{name:"Canadian Dollar",flag:"🇨🇦",symbol:"C$"}, CHF:{name:"Swiss Franc",flag:"🇨🇭",symbol:"CHF"}, CNY:{name:"Chinese Yuan",flag:"🇨🇳",symbol:"¥"}, INR:{name:"Indian Rupee",flag:"🇮🇳",symbol:"₹"}, THB:{name:"Thai Baht",flag:"🇹🇭",symbol:"฿"}, VND:{name:"Vietnamese Dong",flag:"🇻🇳",symbol:"₫"}, KRW:{name:"South Korean Won",flag:"🇰🇷",symbol:"₩"}, IDR:{name:"Indonesian Rupiah",flag:"🇮🇩",symbol:"Rp"}, MYR:{name:"Malaysian Ringgit",flag:"🇲🇾",symbol:"RM"}, PHP:{name:"Philippine Peso",flag:"🇵🇭",symbol:"₱"}, HKD:{name:"Hong Kong Dollar",flag:"🇭🇰",symbol:"HK$"}, TWD:{name:"New Taiwan Dollar",flag:"🇹🇼",symbol:"NT$"}, AED:{name:"UAE Dirham",flag:"🇦🇪",symbol:"د.إ"}, SAR:{name:"Saudi Riyal",flag:"🇸🇦",symbol:"﷼"}, TRY:{name:"Turkish Lira",flag:"🇹🇷",symbol:"₺"}, ZAR:{name:"South African Rand",flag:"🇿🇦",symbol:"R"}, BRL:{name:"Brazilian Real",flag:"🇧🇷",symbol:"R$"}, MXN:{name:"Mexican Peso",flag:"🇲🇽",symbol:"MX$"}, SEK:{name:"Swedish Krona",flag:"🇸🇪",symbol:"kr"}, NOK:{name:"Norwegian Krone",flag:"🇳🇴",symbol:"kr"}, DKK:{name:"Danish Krone",flag:"🇩🇰",symbol:"kr"}, PLN:{name:"Polish Zloty",flag:"🇵🇱",symbol:"zł"}, CZK:{name:"Czech Koruna",flag:"🇨🇿",symbol:"Kč"}, HUF:{name:"Hungarian Forint",flag:"🇭🇺",symbol:"Ft"}, RON:{name:"Romanian Leu",flag:"🇷🇴",symbol:"lei"}, ISK:{name:"Icelandic Krona",flag:"🇮🇸",symbol:"kr"}, ILS:{name:"Israeli New Shekel",flag:"🇮🇱",symbol:"₪"}, EGP:{name:"Egyptian Pound",flag:"🇪🇬",symbol:"E£"}, PKR:{name:"Pakistani Rupee",flag:"🇵🇰",symbol:"₨"}, BDT:{name:"Bangladeshi Taka",flag:"🇧🇩",symbol:"৳"}, KES:{name:"Kenyan Shilling",flag:"🇰🇪",symbol:"KSh"}, NGN:{name:"Nigerian Naira",flag:"🇳🇬",symbol:"₦"}, ARS:{name:"Argentine Peso",flag:"🇦🇷",symbol:"$"}, CLP:{name:"Chilean Peso",flag:"🇨🇱",symbol:"CLP$"}, COP:{name:"Colombian Peso",flag:"🇨🇴",symbol:"COL$"}
};
/* Every currency the rate service publishes; names, flags and symbols are generated for the ones not hand-listed above. */
(()=>{const codes="AED AFN ALL AMD ANG AOA ARS AUD AWG AZN BAM BBD BDT BGN BHD BIF BMD BND BOB BRL BSD BTN BWP BYN BZD CAD CDF CHF CLF CLP CNH CNY COP CRC CUP CVE CZK DJF DKK DOP DZD EGP ERN ETB EUR FJD FKP FOK GBP GEL GGP GHS GIP GMD GNF GTQ GYD HKD HNL HRK HTG HUF IDR ILS IMP INR IQD IRR ISK JEP JMD JOD JPY KES KGS KHR KID KMF KRW KWD KYD KZT LAK LBP LKR LRD LSL LYD MAD MDL MGA MKD MMK MNT MOP MRU MUR MVR MWK MXN MYR MZN NAD NGN NIO NOK NPR NZD OMR PAB PEN PGK PHP PKR PLN PYG QAR RON RSD RUB RWF SAR SBD SCR SDG SEK SGD SHP SLE SLL SOS SRD SSP STN SYP SZL THB TJS TMT TND TOP TRY TTD TVD TWD TZS UAH UGX USD UYU UZS VES VND VUV WST XAF XCD XCG XDR XOF XPF YER ZAR ZMW ZWG ZWL".split(" ");
 const FL={EUR:"🇪🇺",ANG:"🇨🇼",XCG:"🇨🇼",CNH:"🇨🇳",CLF:"🇨🇱",XAF:"🌍",XOF:"🌍",XCD:"🌎",XPF:"🌏",XDR:"🌐"};
 const NM={CNH:"Chinese Yuan (Offshore)",XCG:"Caribbean Guilder",FOK:"Faroese Króna",GGP:"Guernsey Pound",IMP:"Manx Pound",JEP:"Jersey Pound",KID:"Kiribati Dollar",TVD:"Tuvaluan Dollar",ZWG:"Zimbabwe Gold",CLF:"Chilean Unit of Account (UF)",XDR:"IMF Special Drawing Rights",XAF:"Central African CFA Franc",XOF:"West African CFA Franc",XCD:"East Caribbean Dollar",XPF:"CFP Franc"};
 let dn=null;try{dn=new Intl.DisplayNames(["en"],{type:"currency"})}catch{}
 for(const c of codes){if(CURRENCIES[c])continue;
  const flag=FL[c]||String.fromCodePoint(...[...c.slice(0,2)].map(x=>0x1F1E6+x.charCodeAt(0)-65));
  let name=NM[c];if(!name){try{name=dn&&dn.of(c)}catch{}}if(!name||name===c)name=c;
  let sym=c;try{sym=new Intl.NumberFormat("en",{style:"currency",currency:c,currencyDisplay:"narrowSymbol"}).formatToParts(0).find(p=>p.type==="currency").value}catch{}
  CURRENCIES[c]={name,flag,symbol:sym}}})();
const SEARCH={};
(()=>{let rn=null;try{rn=new Intl.DisplayNames(["en"],{type:"region"})}catch{}
 const X={EUR:"europe eurozone european union",ANG:"curacao sint maarten",XCG:"curacao sint maarten",CNH:"china",XAF:"central africa cameroon gabon chad",XOF:"west africa senegal ivory coast mali",XCD:"caribbean antigua grenada st lucia",XPF:"pacific tahiti new caledonia",XDR:"imf",CLF:"chile"};
 for(const c in CURRENCIES){let reg=X[c]||"";if(!X[c]){try{reg=rn?rn.of(c.slice(0,2)):""}catch{}}SEARCH[c]=`${c} ${CURRENCIES[c].name} ${reg}`.toLowerCase()}})();
const defaults=["USD","EUR","GBP","JPY","NZD","VND"];
const FRANK=new Set("AUD BGN BRL CAD CHF CNY CZK DKK EUR GBP HKD HUF IDR ILS INR ISK JPY KRW MXN MYR NOK NZD PHP PLN RON SEK SGD THB TRY USD ZAR".split(" "));
const $=id=>document.getElementById(id);
const ic=n=>`<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const iso=d=>d.toISOString().slice(0,10), daysAgo=n=>new Date(Date.now()-n*864e5);
const FEEDBACK_KEY="76bc13f5-a9dc-4278-a52c-1220487872ae";
const HIST_TTL=6*36e5, REFRESH_MS=30*60e3;

/* ---------- state ---------- */
let watchlist=(()=>{const a=store.get("rateboard.watchlist",null);return Array.isArray(a)?[...new Set(a.filter(x=>CURRENCIES[x]))]:defaults.slice()})();
let pinned=store.get("rateboard.pinned",[]).filter(c=>watchlist.includes(c));
let alerts=store.get("rateboard.alerts",{});
let range=[7,30,90].includes(store.get("rateboard.range",30))?store.get("rateboard.range",30):30;
let rates={}, meta=null, health="loading", lastFetch=0, fetchSeq=0;
let hist={}, histState={}, histSrc={};
let drag=null, renderPending=false, openCode=null;
const base=()=>$("base").value;
const akey=(b,c)=>b+":"+c;
const ordered=()=>[...watchlist.filter(c=>pinned.includes(c)),...watchlist.filter(c=>!pinned.includes(c))];
const visible=()=>ordered().filter(c=>c!==base());
function saveList(){store.set("rateboard.watchlist",watchlist);store.set("rateboard.pinned",pinned)}
function saveAlerts(){store.set("rateboard.alerts",alerts)}

/* ---------- formatting ---------- */
function fmt(n,max=4){return Number(n).toLocaleString(undefined,{maximumFractionDigits:max,minimumFractionDigits:0})}
function cardRate(v){return fmt(v,v>=1000?1:v>=100?2:v>=0.1?4:6)}
function rateFmt(v){return fmt(v,v>=1000?1:v>=100?2:v>=1?4:6)}
function money(n,code){let s=CURRENCIES[code]?.symbol||code;if(/[A-Za-z]$/.test(s))s+=" ";const d=["JPY","KRW","VND","IDR"].includes(code)?0:2;return s+Number(n).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d})}
function fmtD(d,year){return new Date(d+"T00:00:00Z").toLocaleDateString(undefined,{day:"numeric",month:"short",year:year?"numeric":undefined,timeZone:"UTC"})}
function ago(ms){const m=Math.round((Date.now()-ms)/6e4);return m<1?"just now":m<60?m+"m ago":m<1440?Math.round(m/60)+"h ago":Math.round(m/1440)+"d ago"}
function fillSelect(sel,codes,chosen){sel.innerHTML=codes.map(c=>`<option value="${c}" ${c===chosen?"selected":""}>${CURRENCIES[c].flag} ${c} · ${CURRENCIES[c].name}</option>`).join("")}

/* ---------- history (real daily rates) ---------- */
const HKEY=b=>"rateboard.hist.v2."+b;
const readHist=b=>store.get(HKEY(b),null);
function saveHist(b){store.set(HKEY(b),{t:Date.now(),d:hist[b],s:histSrc[b]||{}})}
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw Error(r.status);return r.json()}
async function histFrank(b,codes){if(!codes.length)return;try{
 const d=await getJSON(`https://api.frankfurter.dev/v1/${iso(daysAgo(92))}..${iso(new Date())}?base=${b}&symbols=${codes.join(",")}`);
 for(const day of Object.keys(d.rates).sort())for(const c of codes){const v=d.rates[day][c];if(Number.isFinite(v)){(hist[b][c]=hist[b][c]||[]).push([day,v]);histSrc[b][c]="ecb"}}}catch{}}
async function histFallback(b,codes){if(!codes.length)return;const offs=[];for(let i=1;i<=14;i++)offs.push(i);for(let i=17;i<=92;i+=3)offs.push(i);const bl=b.toLowerCase(),out={};
 for(let i=0;i<offs.length;i+=8)await Promise.all(offs.slice(i,i+8).map(async o=>{const day=iso(daysAgo(o));try{const t=(await getJSON(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${day}/v1/currencies/${bl}.json`))[bl];for(const c of codes){const v=t&&t[c.toLowerCase()];if(Number.isFinite(v))(out[c]=out[c]||[]).push([day,v])}}catch{}}));
 for(const c of codes)if(out[c]){hist[b][c]=out[c].sort((x,y)=>x[0]<y[0]?-1:1);histSrc[b][c]="community"}}
async function loadHistory(b){
 if(!hist[b]){hist[b]={};histSrc[b]={};const o=readHist(b);if(o&&Date.now()-o.t<HIST_TTL){hist[b]=o.d||{};histSrc[b]=o.s||{};for(const c in hist[b])histState[b+c]="ok"}}
 const need=watchlist.filter(c=>c!==b&&!hist[b][c]&&!["loading","none"].includes(histState[b+c]));if(!need.length)return;
 need.forEach(c=>histState[b+c]="loading");render();
 const have=c=>(hist[b][c]||[]).length>1;
 await histFrank(b,FRANK.has(b)?need.filter(c=>FRANK.has(c)):[]);
 await histFallback(b,need.filter(c=>!have(c)));
 const old=need.some(c=>!have(c))?readHist(b):null;
 for(const c of need){if(!have(c)&&old?.d?.[c]?.length>1){hist[b][c]=old.d[c];histSrc[b][c]=old.s?.[c]||"community"}histState[b+c]=have(c)?"ok":"none"}
 saveHist(b);render()}
function series(b,code){const a=hist[b]?.[code];if(!a)return null;const cut=iso(daysAgo(range));const p=a.filter(x=>x[0]>=cut);return p.length>1?p:null}
function trendInfo(pts){const a=pts[0][1],z=pts[pts.length-1][1],r=Math.round((z-a)/a*1e4)/100;return{r,abs:z-a,dir:r>0?"up":r<0?"down":"flat",arrow:r>0?"▲":r<0?"▼":"–",txt:`${r>0?"+":r<0?"−":""}${Math.abs(r).toFixed(2)}%`}}
function spark(pts,label){const w=120,h=44,pad=4,v=pts.map(x=>x[1]),mn=Math.min(...v),mx=Math.max(...v),n=pts.length,t0=Date.parse(pts[0][0]),t1=Date.parse(pts[n-1][0]);
 const X=p=>pad+(Date.parse(p[0])-t0)/(t1-t0||1)*(w-2*pad),Y=x=>mx===mn?h/2:h-pad-(x-mn)/(mx-mn)*(h-2*pad);
 const d=pts.map((q,i)=>`${i?"L":"M"}${X(q).toFixed(1)} ${Y(q[1]).toFixed(1)}`).join("");
 return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}"><title>${label}</title><path class="area" d="${d}L${X(pts[n-1]).toFixed(1)} ${h}L${X(pts[0]).toFixed(1)} ${h}Z"/><path class="line" d="${d}"/><circle cx="${X(pts[n-1]).toFixed(1)}" cy="${Y(v[n-1]).toFixed(1)}" r="2.6"/></svg>`}
function trendHTML(b,code){const pts=series(b,code),st=histState[b+code];
 if(!pts)return st==="loading"||st===undefined?'<div class="trend-empty loading">Loading<br>history…</div>':'<div class="trend-empty">No history<br>available</div>';
 const t=trendInfo(pts);return `<div class="trend ${t.dir}">${spark(pts,`${code} against ${b}, ${range} days: ${t.txt}, from ${pts[0][0]} to ${pts[pts.length-1][0]}`)}<div class="chg">${t.arrow} ${t.txt}<small>${range}D</small></div></div>`}

/* ---------- rates: provider, backup, offline cache ---------- */
const RKEY=b=>"rateboard.rates.v1."+b;
async function providerRates(b){
 try{const d=await getJSON(`https://open.er-api.com/v6/latest/${encodeURIComponent(b)}`);if(d.result!=="success"||!d.rates)throw Error("bad");
  const r={};for(const [c,v] of Object.entries(d.rates))if(CURRENCIES[c]&&Number.isFinite(Number(v)))r[c]=Number(v);r[b]=1;if(Object.keys(r).length<=1)throw Error("empty");
  return{rates:r,time:d.time_last_update_unix?d.time_last_update_unix*1000:Date.now(),source:"ExchangeRate-API",backup:false}}catch{}
 const bl=b.toLowerCase();
 for(const u of [`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/${bl}.json`,`https://latest.currency-api.pages.dev/v1/currencies/${bl}.json`]){
  try{const d=await getJSON(u),t=d[bl];if(!t)throw Error("bad");const r={};for(const c of Object.keys(CURRENCIES)){const v=t[c.toLowerCase()];if(Number.isFinite(v))r[c]=v}r[b]=1;if(Object.keys(r).length<=1)throw Error("empty");
   return{rates:r,time:Date.parse(d.date+"T00:00:00Z")||Date.now(),source:"backup source (fawazahmed0)",backup:true}}catch{}}
 throw Error("all rate sources failed")}
function applyRates(b,r,stale){rates=r.rates;meta={time:r.time,source:r.source,backup:r.backup,stale:!!stale,fetched:r.fetched||Date.now()}}
function loadCached(b){const c=store.get(RKEY(b),null);if(c?.rates){applyRates(b,c,true);return true}rates={};meta=null;return false}
function rateDateStr(){return meta?new Date(meta.time).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}):""}
function setHealth(h){health=h;updateLive()}
function updateLive(){const dot=$("dot"),t=$("liveText");dot.className="dot"+(health==="backup"||health==="cached"?" warn":health==="bad"?" bad":"");
 t.textContent=health==="loading"?"Rates loading":health==="bad"?"Rates unavailable":health==="cached"?"Offline · saved rates":(health==="backup"?"Backup · ":"Updated ")+ago(lastFetch)}
async function fetchRates(){
 const b=base(),seq=++fetchSeq,btn=$("refreshBtn"),status=$("status");loadHistory(b);
 btn.disabled=true;btn.textContent="Refreshing…";status.className="status";status.textContent="Getting the latest available reference rates…";
 try{const r=await providerRates(b);if(seq!==fetchSeq)return;r.fetched=Date.now();store.set(RKEY(b),r);applyRates(b,r,false);lastFetch=r.fetched;
  if(r.backup){setHealth("backup");status.className="status warn";status.textContent=`Main rate service unavailable, using the ${r.source}. Rate date ${rateDateStr()}.`}
  else{setHealth("ok");status.className="status";status.textContent=""}
  render();convert();checkAlerts(b,rates)}
 catch{if(seq!==fetchSeq)return;
  if(meta||loadCached(b)){lastFetch=meta.fetched;setHealth("cached");status.className="status warn";status.textContent=`Couldn't reach any rate service. Showing your saved rates from ${new Date(meta.fetched).toLocaleString(undefined,{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}.`;meta.stale=true}
  else{setHealth("bad");status.className="status error";status.textContent="Could not load rates. Check your internet connection and try again."}
  render();convert()}
 finally{if(seq===fetchSeq){btn.disabled=false;btn.innerHTML=ic("refresh")+"Refresh rates"}}
 checkOtherBases()}

/* ---------- alerts ---------- */
function condMet(a,v){return a.dir==="above"?v>=a.value:v<=a.value}
function checkAlerts(b,map){let hit=false;for(const [k,a] of Object.entries(alerts)){if(!k.startsWith(b+":")||a.triggered)continue;const code=k.slice(b.length+1),v=map[code];
  if(Number.isFinite(v)&&condMet(a,v)){a.triggered=true;a.ack=false;a.hitAt=Date.now();a.hitRate=v;hit=true;
   try{if("Notification" in window&&Notification.permission==="granted")new Notification("Rateboard alert",{body:`1 ${b} is now ${rateFmt(v)} ${code} (alert: ${a.dir==="above"?"≥":"≤"} ${rateFmt(a.value)})`})}catch{}}}
 if(hit)saveAlerts();renderAlertBar();if(hit){render();renderAlertBox()}}
async function checkOtherBases(){const bases=[...new Set(Object.entries(alerts).filter(([k,a])=>!a.triggered&&!k.startsWith(base()+":")).map(([k])=>k.split(":")[0]))];
 for(const b of bases){try{const r=await providerRates(b);checkAlerts(b,r.rates)}catch{}}}
function renderAlertBar(){const bar=$("alertBar"),items=Object.entries(alerts).filter(([,a])=>a.triggered&&!a.ack);bar.hidden=!items.length;
 bar.innerHTML=items.map(([k,a])=>{const [b,c]=k.split(":");return `<div class="a"><span>${ic("bell")} <b>1 ${b} is now ${rateFmt(a.hitRate)} ${c}</b> — your alert for ${a.dir==="above"?"at or above":"at or below"} ${rateFmt(a.value)} was reached.</span><button data-ack="${k}">Dismiss</button></div>`}).join("")}

/* ---------- watchlist rendering ---------- */
function cardHTML(code,b){const c=CURRENCIES[code],val=rates[code],al=alerts[akey(b,code)];
 const bell=al?`<span class="abell${al.triggered?" on":""}" title="${al.triggered?"Alert reached":"Alert set"}: ${al.dir==="above"?"≥":"≤"} ${rateFmt(al.value)}">${ic("bell")}</span>`:"";
 const pin=pinned.includes(code)?`<span class="pinmark" title="Pinned">${ic("star")}</span>`:"";
 const badge=meta?.stale?'<span class="badge">Saved copy</span>':meta?.backup?'<span class="badge">Backup</span>':"";
 return `<article class="card${al?.triggered?" alert-hit":""}" data-code="${code}"><button class="stubcode" type="button" data-open="${code}" aria-label="${c.name}: chart, alerts and options"><span class="code-big">${code}</span><span class="flag">${c.flag}</span></button>
 <div class="cmid"><div class="cname"><span class="nm">${c.name}</span>${pin}${bell}${badge}</div><div class="rate">${val==null?"—":`<span class="sym">${c.symbol}</span>${cardRate(val)}`}</div></div>${trendHTML(b,code)}
 <button class="ibtn grip" type="button" data-grip="${code}" title="Drag to reorder (or use arrow keys)" aria-label="Reorder ${code}. Use arrow keys to move.">${ic("grip")}</button></article>`}
function render(){if(drag){renderPending=true;return}renderPending=false;const b=base(),grid=$("grid"),list=visible();
 $("legend").innerHTML=`Trend lines show the last ${range} days: <b class="up">green ▲</b> means 1 ${b} now buys more of that currency, <b class="down">red ▼</b> means it buys less. Pinned currencies stay on top.`;
 $("sumText").textContent=`What 1 ${b} is worth in each currency. Tap a currency for its chart, alerts and pin.`;fillAdd();
 $("count").textContent=`${list.length} ${list.length===1?"currency":"currencies"}`;
 grid.innerHTML=list.length?list.map(c=>cardHTML(c,b)).join(""):'<div class="empty"><strong>Your watchlist is empty</strong><button class="btn btn-light" type="button" data-focus-add style="margin-top:14px">'+ic("plus")+'Add a currency</button></div>';
  renderDetailData();renderAll()}

/* ---------- remove with undo ---------- */
let undoTimer=null;
function removeCurrency(code){const snap={code,idx:watchlist.indexOf(code),pin:pinned.includes(code),alerts:{}};
 for(const k of Object.keys(alerts))if(k.endsWith(":"+code)){snap.alerts[k]=alerts[k];delete alerts[k]}
 watchlist=watchlist.filter(x=>x!==code);pinned=pinned.filter(x=>x!==code);saveList();saveAlerts();renderAlertBar();render();
 const n=Object.keys(snap.alerts).length,t=$("toast");$("toastMsg").textContent=`Removed ${code}${n?` and ${n===1?"its alert":n+" alerts"}`:""}.`;t.hidden=false;
 clearTimeout(undoTimer);undoTimer=setTimeout(()=>t.hidden=true,6000);
 $("undoBtn").onclick=()=>{clearTimeout(undoTimer);t.hidden=true;if(!watchlist.includes(code))watchlist.splice(Math.min(snap.idx,watchlist.length),0,code);
  if(snap.pin&&!pinned.includes(code))pinned.push(code);Object.assign(alerts,snap.alerts);saveList();saveAlerts();renderAlertBar();render();loadHistory(base());
  document.querySelector(`[data-open="${code}"]`)?.focus()}}

/* ---------- reorder (pointer drag + keyboard) ---------- */
function commitOrder(vis){watchlist=vis.concat(watchlist.filter(c=>!vis.includes(c)));saveList()}
function wireGrid(){const grid=$("grid");
 grid.addEventListener("click",e=>{const t=e.target.closest("button");
  if(t){const d=t.dataset;
   if(d.focusAdd!==undefined)$("addCurrencyCombo").focus();
   else if(d.remove)removeCurrency(d.remove);
   else if(d.pin){pinned=pinned.includes(d.pin)?pinned.filter(x=>x!==d.pin):[...pinned,d.pin];saveList();render()}
   else if(d.bell||d.open)openDetail(d.bell||d.open,!!d.bell);
   return}
  const card=e.target.closest(".card");if(card)openDetail(card.dataset.code)});
 grid.addEventListener("pointerdown",e=>{const g=e.target.closest("[data-grip]");if(!g||e.button>0)return;e.preventDefault();
  const card=g.closest(".card");drag={card,id:e.pointerId};g.setPointerCapture(e.pointerId);card.classList.add("dragging")});
 grid.addEventListener("pointermove",e=>{if(!drag||e.pointerId!==drag.id)return;
  if(e.clientY<70)scrollBy(0,-16);else if(e.clientY>innerHeight-70)scrollBy(0,16);
  const over=document.elementFromPoint(e.clientX,e.clientY)?.closest(".card");
  if(!over||over===drag.card||!grid.contains(over))return;
  if(pinned.includes(over.dataset.code)!==pinned.includes(drag.card.dataset.code))return;
  if(over.compareDocumentPosition(drag.card)&Node.DOCUMENT_POSITION_FOLLOWING)grid.insertBefore(drag.card,over);else over.after(drag.card)});
 const end=e=>{if(!drag||e.pointerId!==drag.id)return;const order=[...grid.querySelectorAll(".card")].map(c=>c.dataset.code);drag.card.classList.remove("dragging");drag=null;commitOrder(order);render()};
 grid.addEventListener("pointerup",end);grid.addEventListener("pointercancel",end);
 grid.addEventListener("keydown",e=>{const g=e.target.closest("[data-grip]");if(!g)return;const k=e.key;if(!["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(k))return;e.preventDefault();
  const code=g.dataset.grip,vis=visible(),i=vis.indexOf(code),j=i+(k==="ArrowUp"||k==="ArrowLeft"?-1:1);
  if(j<0||j>=vis.length||pinned.includes(vis[j])!==pinned.includes(code))return;[vis[i],vis[j]]=[vis[j],vis[i]];commitOrder(vis);render();grid.querySelector(`[data-grip="${code}"]`)?.focus()})}

/* ---------- detail dialog: big chart, stats, alert ---------- */
function chartHTML(pts){const t0=Date.parse(pts[0][0]),t1=Date.parse(pts[pts.length-1][0]),v=pts.map(p=>p[1]),mn=Math.min(...v),mx=Math.max(...v);
 const X=p=>(Date.parse(p[0])-t0)/(t1-t0||1)*100,Y=x=>mx===mn?50:14+(mx-x)/(mx-mn)*72;
 const d=pts.map((p,i)=>`${i?"L":"M"}${X(p).toFixed(2)} ${Y(p[1]).toFixed(2)}`).join("");const dir=trendInfo(pts).dir;
 return `<div class="chart ${dir}" id="chart"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line class="gl" x1="0" x2="100" y1="14" y2="14"/><line class="gl" x1="0" x2="100" y1="50" y2="50"/><line class="gl" x1="0" x2="100" y1="86" y2="86"/><path class="area" d="${d}L100 100L0 100Z"/><path class="line" d="${d}"/></svg><span class="ylab top">${rateFmt(mx)}</span><span class="ylab bot">${rateFmt(mn)}</span><div class="xhair" hidden></div><div class="cdot" hidden></div><div class="tip" hidden></div></div><div class="xlabs"><span>${fmtD(pts[0][0],true)}</span><span>${fmtD(pts[pts.length-1][0],true)}</span></div>`}
function bindChart(pts){const ch=$("chart");if(!ch)return;const t0=Date.parse(pts[0][0]),t1=Date.parse(pts[pts.length-1][0]),v=pts.map(p=>p[1]),mn=Math.min(...v),mx=Math.max(...v);
 const xs=pts.map(p=>(Date.parse(p[0])-t0)/(t1-t0||1)*100),ys=v.map(x=>mx===mn?50:14+(mx-x)/(mx-mn)*72);
 const xh=ch.querySelector(".xhair"),dot=ch.querySelector(".cdot"),tip=ch.querySelector(".tip"),b=base(),code=openCode;
 const show=i=>{[xh,dot,tip].forEach(n=>n.hidden=false);xh.style.left=xs[i]+"%";dot.style.left=xs[i]+"%";dot.style.top=ys[i]+"%";tip.style.left=Math.min(82,Math.max(18,xs[i]))+"%";tip.textContent=`${fmtD(pts[i][0],true)} · ${rateFmt(pts[i][1])} ${code}`};
 const hide=()=>[xh,dot,tip].forEach(n=>n.hidden=true);
 ch.addEventListener("pointermove",e=>{const r=ch.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*100;let bi=0,bd=1e9;xs.forEach((x,i)=>{const dd=Math.abs(x-px);if(dd<bd){bd=dd;bi=i}});show(bi)});
 ch.addEventListener("pointerleave",hide);ch.addEventListener("pointercancel",hide)}
function openDetail(code,toAlert){openCode=code;const c=CURRENCIES[code],dlg=$("detail");
 dlg.innerHTML=`<div class="dlg-in"><div class="dlg-head"><span class="flag">${c.flag}</span><div><h3 id="dTitle">${c.name}</h3><div class="currency-code">${code}</div></div><button class="dlg-close" id="dClose" aria-label="Close"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button></div>
 <div class="dlg-top"><div class="dlg-rate" id="dRate"></div><div class="seg" role="group" aria-label="Chart period"><button data-range="7">7D</button><button data-range="30">30D</button><button data-range="90">90D</button></div></div>
 <div id="dChart"></div><div class="stats" id="dStats"></div><p class="src" id="dSrc"></p>
 <div class="alertbox" id="alertBox"><h4>Rate alert</h4><div class="alert-state" id="aState"></div>
  <div class="alert-form"><select id="aDir" aria-label="Alert direction"><option value="above">Rises to or above</option><option value="below">Falls to or below</option></select><input id="aVal" type="number" step="any" min="0" inputmode="decimal" aria-label="Alert rate"><button class="btn btn-primary" id="aSet">Set alert</button></div>
  <p class="hint" id="aHint"></p></div>
 <div class="dlg-actions"><button class="btn btn-light" id="dConvert">${ic("swap")}Use in converter</button><button class="btn btn-light" id="dPin" type="button"></button><button class="btn btn-light danger" id="dRemove" type="button">${ic("x")}Remove</button></div></div>`;
 if(!dlg.open)dlg.showModal();syncPinBtn();syncRangeButtons();renderDetailData();renderAlertBox();
 if(toAlert)$("alertBox").scrollIntoView({block:"nearest"})}
function renderDetailData(){const dlg=$("detail");if(!openCode||!dlg.open||!$("dRate"))return;const code=openCode,b=base(),pts=series(b,code),val=rates[code];
 const t=pts?trendInfo(pts):null;
 $("dRate").innerHTML=`<div class="rate-label" style="margin:0">1 ${b} is worth</div><div class="rate">${val==null?"—":`<span class="sym">${CURRENCIES[code].symbol}</span>${rateFmt(val)}`}</div>${t?`<div class="chip ${t.dir}">${t.arrow} ${t.txt} · ${range}D</div>`:""}`;
 $("dChart").innerHTML=pts?chartHTML(pts):`<div class="chart-empty">${histState[b+code]==="loading"||histState[b+code]===undefined?"Loading history…":"No historical data is available for this currency."}</div>`;
 if(pts){bindChart(pts);let hi=pts[0],lo=pts[0];for(const p of pts){if(p[1]>hi[1])hi=p;if(p[1]<lo[1])lo=p}const avg=pts.reduce((s,p)=>s+p[1],0)/pts.length;
  $("dStats").innerHTML=`<div class="stat"><small>High</small><b>${rateFmt(hi[1])}</b><span>${fmtD(hi[0])}</span></div><div class="stat"><small>Low</small><b>${rateFmt(lo[1])}</b><span>${fmtD(lo[0])}</span></div><div class="stat"><small>Average</small><b>${rateFmt(avg)}</b><span>${pts.length} data points</span></div><div class="stat"><small>Change</small><b class="chip ${t.dir}">${t.arrow} ${t.txt}</b><span>${t.abs>=0?"+":"−"}${rateFmt(Math.abs(t.abs))} ${code}</span></div>`;
  $("dSrc").textContent=histSrc[b]?.[code]==="ecb"?"History: European Central Bank daily reference rates via Frankfurter.":"History: community daily rates (fawazahmed0 currency-api), sampled every few days beyond two weeks."}
 else{$("dStats").innerHTML="";$("dSrc").textContent=""}}
function renderAlertBox(){if(!openCode||!$("aState"))return;const code=openCode,b=base(),al=alerts[akey(b,code)],val=rates[code];
 $("aState").innerHTML=al?(al.triggered?`<div class="row"><span>Reached ${new Date(al.hitAt).toLocaleString(undefined,{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})} at ${rateFmt(al.hitRate)} ${code} (target ${al.dir==="above"?"≥":"≤"} ${rateFmt(al.value)}).</span><button id="aReset">Watch again</button><button id="aRemove">Remove</button></div>`:`<div class="row">${ic("bell")}<span>Waiting for 1 ${b} ${al.dir==="above"?"≥":"≤"} ${rateFmt(al.value)} ${code}.</span><button id="aRemove">Remove</button></div>`):'<span style="color:var(--muted)">No alert set for this currency.</span>';
 $("aHint").textContent=`${val!=null?`Now: 1 ${b} = ${rateFmt(val)} ${code}. `:""}Checked each time rates refresh while Rateboard is open. Setting an alert may ask permission to show notifications.`;
 if(!$("aVal").value&&val!=null)$("aVal").value=Number((val*1.01).toPrecision(5))}
function syncPinBtn(){const b=$("dPin");if(!b||!openCode)return;const p=pinned.includes(openCode);b.innerHTML=ic("star")+(p?"Unpin":"Pin to top");b.classList.toggle("on",p)}
function wireDetail(){const dlg=$("detail");
 dlg.addEventListener("click",e=>{if(e.target===dlg){dlg.close();return}const id=e.target.closest("button")?.id;if(!id)return;const code=openCode,b=base(),k=akey(b,code);
  if(id==="dClose")dlg.close();
  else if(id==="dPin"){pinned=pinned.includes(code)?pinned.filter(x=>x!==code):[...pinned,code];saveList();render();syncPinBtn()}
  else if(id==="dRemove"){dlg.close();removeCurrency(code)}
  else if(id==="aSet"){const v=Number($("aVal").value);if(!(v>0)){$("aHint").textContent="Enter a rate greater than zero.";return}alerts[k]={dir:$("aDir").value,value:v,triggered:false,ack:false};saveAlerts();
   try{if("Notification" in window&&Notification.permission==="default")Notification.requestPermission()}catch{}
   if(rates[code]!=null)checkAlerts(b,{[code]:rates[code]});renderAlertBox();render();renderAlertBar()}
  else if(id==="aRemove"){delete alerts[k];saveAlerts();renderAlertBox();render();renderAlertBar()}
  else if(id==="aReset"){alerts[k]={...alerts[k],triggered:false,ack:false};delete alerts[k].hitAt;delete alerts[k].hitRate;saveAlerts();renderAlertBox();render();renderAlertBar()}
  else if(id==="dConvert"){$("from").value=b;$("to").value=code;syncCombos();saveConv();convert();dlg.close();$("converter").scrollIntoView({behavior:"smooth",block:"start"})}});
 dlg.addEventListener("close",()=>{openCode=null})}

/* ---------- range, theme ---------- */
function syncRangeButtons(){document.querySelectorAll("[data-range]").forEach(x=>x.setAttribute("aria-pressed",String(Number(x.dataset.range)===range)))}
function setRange(r){range=r;store.set("rateboard.range",r);syncRangeButtons();render()}
const THEMES=["auto","light","dark"],darkMQ=matchMedia("(prefers-color-scheme: dark)");
const curTheme=()=>{const t=store.get("rateboard.theme","auto");return THEMES.includes(t)?t:"auto"},effTheme=t=>t==="auto"?(darkMQ.matches?"dark":"light"):t;
function applyTheme(t){if(t==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;document.querySelectorAll("[data-theme-set]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.themeSet===t)))}

/* ---------- converter ---------- */
const saveConv=()=>store.set("rateboard.converter",{amount:$("amount").value,from:$("from").value,to:$("to").value});
let lastResult="";
const mctx=document.createElement("canvas").getContext("2d");
function textX(el){const r=el.getBoundingClientRect(),cs=getComputedStyle(el);mctx.font=`${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;const w=mctx.measureText(el.value).width;return cs.textAlign==="right"?r.right-w:r.left}
function convert(){convertCore();{const o=$("converted");o.style.setProperty("--len",Math.max(5,o.textContent.length))}renderAll()}
function convertCore(){const amount=Number($("amount").value),from=$("from").value,to=$("to").value,out=$("converted"),detail=$("conversionDetail");lastResult="";
 $("fromName").textContent=CURRENCIES[from]?`${CURRENCIES[from].flag} ${CURRENCIES[from].name}`:"";$("toName").textContent=CURRENCIES[to]?`${CURRENCIES[to].flag} ${CURRENCIES[to].name}`:"";
 {const a=rates[from],z=rates[to];$("pRate").textContent=a!=null&&z!=null?`1 ${from} = ${cardRate(z/a)} ${to}`:"—";$("pRate").title=a!=null&&z!=null?`1 ${from} = ${rateFmt(z/a)} ${to}`:"";$("pSrc").title=meta?.source||"";$("pDate").textContent=meta?rateDateStr():"—";$("pSrc").textContent=meta?(meta.stale?"Saved copy":meta.backup?"Backup source":meta.source):"—"}
 if(!Number.isFinite(amount)||amount<0||$("amount").value===""){out.textContent="Enter an amount";detail.textContent="Use zero or a positive amount.";return}
 if(from===to){out.textContent=money(amount,to);lastResult=`${fmt(amount,2)} ${to}`;detail.textContent=`1 ${from} = 1 ${to}`;return}
 const r1=rates[from],r2=rates[to];
 if(r1!=null&&r2!=null){const val=amount/r1*r2;out.textContent=money(val,to);lastResult=`${val.toLocaleString(undefined,{maximumFractionDigits:["JPY","KRW","VND","IDR"].includes(to)?0:2,minimumFractionDigits:0,useGrouping:false})} ${to}`;detail.textContent=meta?.stale?"Saved rates while offline. Banks and card providers add a margin.":"Mid-market rate. Banks and card providers add a margin."}
 else{out.textContent="—";detail.textContent="Rates for this pair are not loaded yet. Try refresh."}}
async function copyText(txt,btn,label){if(!txt)return;let ok=false;
 try{await navigator.clipboard.writeText(txt);ok=true}catch{try{const t=document.createElement("textarea");t.value=txt;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();ok=document.execCommand("copy");t.remove()}catch{}}
 btn.textContent=ok?"Copied":"Copy failed";setTimeout(()=>btn.textContent=label,1500)}
const copyResult=()=>copyText(lastResult,$("copyBtn"),"Copy");

/* ---------- searchable currency picker (wraps a <select>) ---------- */
const combos=[];const syncCombos=()=>combos.forEach(c=>c.refresh());
function makeCombo(sel,topFn,disp){
 const wrap=document.createElement("div"),input=document.createElement("input"),list=document.createElement("ul");
 wrap.className="combo";input.type="text";input.className="combo-in";input.id=sel.id+"Combo";input.autocomplete="off";input.spellcheck=false;input.autocapitalize="off";input.setAttribute("autocorrect","off");input.enterKeyHint="search";input.setAttribute("inputmode","search");
 input.setAttribute("role","combobox");input.setAttribute("aria-autocomplete","list");input.setAttribute("aria-expanded","false");input.setAttribute("aria-controls",sel.id+"List");
 list.id=sel.id+"List";list.className="combo-list";list.setAttribute("role","listbox");list.hidden=true;
 sel.after(wrap);wrap.append(input,list);sel.classList.add("combo-hidden");sel.tabIndex=-1;
 document.querySelector(`label[for="${sel.id}"]`)?.setAttribute("for",input.id);
 let items=[],act=0,heads={};
 const optText=o=>o.textContent;
 const cur=()=>{const o=sel.options[sel.selectedIndex];return o&&o.value?optText(o):""};
 const refresh=()=>{input.value=disp&&sel.value?disp(sel.value):cur();input.placeholder=sel.id==="addCurrency"?"Search currencies to add…":"Search currencies…"};
 const fit=()=>{if(list.hidden)return;const vv=window.visualViewport,vh=vv?vv.height:innerHeight,r=input.getBoundingClientRect();list.style.maxHeight=Math.max(150,Math.min(272,vh-r.bottom-14))+"px"};
 const begin=()=>{if(!list.hidden)return;input.placeholder=cur()||input.placeholder;input.value="";open("");setTimeout(()=>{wrap.scrollIntoView({block:"start",behavior:"smooth"});setTimeout(fit,350)},250)};
 const close=()=>{list.hidden=true;input.setAttribute("aria-expanded","false")};
 const paint=()=>{list.innerHTML=items.length?items.map((o,i)=>`${heads[i]?`<li class="grp" role="presentation">${heads[i]}</li>`:""}<li role="option" id="${sel.id}-o${i}" data-i="${i}" class="${i===act?"act":""}" aria-selected="${o.value===sel.value}">${optText(o)}</li>`).join(""):'<li class="none">No matching currency</li>';list.querySelector(".act")?.scrollIntoView({block:"nearest"})};
 const open=q=>{q=q.toLowerCase().trim();const score=o=>{const c=o.value,n=CURRENCIES[c].name.toLowerCase();return c.toLowerCase()===q?0:c.toLowerCase().startsWith(q)?1:n.startsWith(q)?2:3};
  const top=topFn?topFn():[],rank=o=>{const i=top.indexOf(o.value);return i<0?1e3:i};
  items=[...sel.options].filter(o=>o.value&&(!q||q.split(/\s+/).every(w=>SEARCH[o.value].includes(w))));
  if(q)items.sort((a,b)=>score(a)-score(b)||rank(a)-rank(b)||a.value.localeCompare(b.value));
  else if(top.length)items.sort((a,b)=>rank(a)-rank(b));
  heads={};if(!q&&top.length){const n=items.filter(o=>rank(o)<1e3).length;if(n){heads[0]="Your currencies";if(n<items.length)heads[n]="All currencies"}}
  act=0;paint();list.hidden=false;input.setAttribute("aria-expanded","true");fit()};
 const pick=i=>{const o=items[i];if(!o)return;sel.value=o.value;sel.dispatchEvent(new Event("change",{bubbles:true}));refresh();close();input.blur()};
 input.addEventListener("focus",begin);
 input.addEventListener("click",begin);
 if(window.visualViewport)visualViewport.addEventListener("resize",fit);
 input.addEventListener("input",()=>open(input.value));
 input.addEventListener("blur",()=>{close();refresh()});
 input.addEventListener("keydown",e=>{const k=e.key;
  if(k==="ArrowDown"||k==="ArrowUp"){e.preventDefault();if(list.hidden)open("");else{act=(act+(k==="ArrowDown"?1:-1)+items.length)%Math.max(items.length,1);paint()}input.setAttribute("aria-activedescendant",`${sel.id}-o${act}`)}
  else if(k==="Enter"){if(!list.hidden){e.preventDefault();pick(act)}}
  else if(k==="Escape"){close();refresh()}});
 list.addEventListener("mousedown",e=>e.preventDefault());
 list.addEventListener("click",e=>{const li=e.target.closest("li[data-i]");if(li)pick(Number(li.dataset.i))});
 refresh();const api={refresh};combos.push(api);return api}

/* ---------- convert to every watchlist currency (folded by default) ---------- */
let allText="";
function renderAll(){const box=$("allBox");if(!box||box.hidden)return;
 const raw=$("amount").value,amount=Number(raw),from=$("from").value,to=$("to").value,r1=rates[from],ok=raw!==""&&Number.isFinite(amount)&&amount>=0;
 const list=[...new Set([base(),...visible()])].filter(c=>c!==from);
 const plain=(v,c)=>v.toLocaleString(undefined,{maximumFractionDigits:["JPY","KRW","VND","IDR"].includes(c)?0:2,minimumFractionDigits:0,useGrouping:false});
 $("allHead").textContent=ok?`${fmt(amount,2)} ${from} is worth`:"Enter an amount above";
 allText=ok&&r1!=null?`${amount} ${from}\n`+list.filter(c=>rates[c]!=null).map(c=>`${plain(amount/r1*rates[c],c)} ${c}`).join("\n"):"";
 $("allRows").innerHTML=list.map(c=>{const r2=rates[c],has=r1!=null&&r2!=null,v=ok&&has?amount/r1*r2:null;
  return `<button class="arow${c===to?" sel":""}" type="button" data-to="${c}" title="Use ${c} as the To currency"><span class="flag">${CURRENCIES[c].flag}</span><span class="nm"><b>${CURRENCIES[c].name}</b><small>${has?`1 ${from} = ${rateFmt(r2/r1)} ${c}`:"Rate not loaded"}</small></span><span class="val">${v==null?"—":money(v,c)}</span></button>`}).join("")}

/* ---------- feedback (emailed to the owner via Web3Forms) ---------- */
function wireFeedback(){const dlg=$("fb"),st=$("fbStatus");let last=0;
 const say=(t,k)=>{st.textContent=t;st.className="hint "+(k||"")};
 ["fbBtn2"].forEach(id=>$(id).addEventListener("click",()=>{say("");dlg.showModal();$("fbMsg").focus()}));
 $("fbClose").addEventListener("click",()=>dlg.close());$("fbCancel").addEventListener("click",()=>dlg.close());
 dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
 $("fbForm").addEventListener("submit",async e=>{e.preventDefault();
  const msg=$("fbMsg").value.trim(),type=$("fbType").value,contact=$("fbContact").value.trim(),btn=$("fbSend");
  if(!msg){say("Write a message first.","bad");return}
  if($("fbBot").checked)return;
  if(!FEEDBACK_KEY){say("Feedback isn't set up yet.","bad");return}
  if(Date.now()-last<15000){say("Give it a few seconds before sending another.","bad");return}
  btn.disabled=true;btn.textContent="Sending…";say("");
  try{const res=await fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},
    body:JSON.stringify({access_key:FEEDBACK_KEY,subject:`Rateboard feedback: ${type}`,from_name:"Rateboard",type,message:msg,...(contact?{email:contact}:{}),page:location.href,base:base(),theme:store.get("rateboard.theme","auto"),screen:`${innerWidth}x${innerHeight}`,agent:navigator.userAgent})});
   const d=await res.json();if(!res.ok||!d.success)throw Error(d.message||res.status);
   last=Date.now();$("fbMsg").value="";say("Sent. Thanks!","good");setTimeout(()=>dlg.close(),1400)}
  catch{say("Couldn't send. Check your connection and try again. Your message is still here.","bad")}
  finally{btn.disabled=false;btn.textContent="Send"}})}

/* ---------- add currency ---------- */
let addKey="";
function fillAdd(){const sel=$("addCurrency"),b=base(),k=b+"|"+watchlist.join();if(k===addKey)return;addKey=k;
 const opts=Object.keys(CURRENCIES).sort().filter(c=>c!==b&&!watchlist.includes(c));
 sel.innerHTML='<option value="">Choose currency…</option>'+opts.map(c=>`<option value="${c}">${CURRENCIES[c].flag} ${c} · ${CURRENCIES[c].name}</option>`).join("");syncCombos()}
function addCurrency(){const sel=$("addCurrency"),code=sel.value;if(!code)return;
 if(code===base()){$("status").className="status";$("status").textContent="That currency is already the base currency. Choose another base or currency.";return}

 ["base","addCurrency"].forEach(id=>makeCombo($(id)));["from","to"].forEach(id=>makeCombo($(id),()=>[base(),...visible()],c=>c));

 document.addEventListener("click",e=>{const r=e.target.closest("[data-range]");if(r)setRange(Number(r.dataset.range));const a=e.target.closest("[data-ack]");if(a){if(alerts[a.dataset.ack]){alerts[a.dataset.ack].ack=true;saveAlerts()}renderAlertBar()}});

 ["amount","from","to"].forEach(id=>$(id).addEventListener(id==="amount"?"input":"change",()=>{saveConv();convert()}));
 $("swapBtn").addEventListener("click",()=>{const f=$("from"),t=$("to"),v=f.value,fi=$("fromCombo"),ti=$("toCombo"),before=[textX(fi),textX(ti)];

  fi.animate([{transform:`translateX(${before[1]-textX(fi)}px)`},{transform:"none"}],o);ti.animate([{transform:`translateX(${before[0]-textX(ti)}px)`},{transform:"none"}],o)});
 $("copyBtn").addEventListener("click",copyResult);

 if(loadCached(b)){lastFetch=meta.fetched;health="cached";updateLive()}

 setInterval(updateLive,30e3);
 setInterval(()=>{if(!document.hidden&&Date.now()-lastFetch>REFRESH_MS)fetchRates()},6e4);

 if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{})}
