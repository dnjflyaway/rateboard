<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Rateboard — canon</title>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--soft:#f3f4f6;--green:#16855f;--red:#c8423b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#fff;color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 14px}
.logo{font-weight:700;font-size:20px;letter-spacing:-.02em}
.upd{font-size:13px;color:var(--muted)}
.upd b{color:var(--green);font-weight:400}
main{padding:4px 20px}
.card{border:1px solid var(--line);border-radius:20px;padding:6px;position:relative}
.field{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:16px;padding:14px 16px}
.field+.field{margin-top:6px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.field input{border:0;background:none;font:600 30px/1.1 inherit;font-family:inherit;color:var(--ink);width:170px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.field input:focus{outline:none}
.field:focus-within{box-shadow:inset 0 0 0 2px var(--ink)}
.cur{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px 8px 10px;font:600 15px inherit;font-family:inherit;color:var(--ink)}
.cur span{font-size:20px;line-height:1}
.cur i{font-style:normal;color:var(--muted);font-size:11px}
.swap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 2px 6px rgba(17,24,39,.08);font-size:18px;color:var(--ink);cursor:pointer}
.meta{margin:14px 4px 0;font-size:13px;color:var(--muted)}
.meta strong{color:var(--ink);font-weight:600;font-size:15px;display:block;margin-bottom:2px}
.actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;height:48px;border-radius:14px;border:0;font:600 15px inherit;font-family:inherit;cursor:pointer}
.primary{background:var(--green);color:#fff}
.ghost{background:var(--soft);color:var(--ink)}
h2{font-size:18px;letter-spacing:-.01em;font-weight:700}
.wl{display:flex;justify-content:space-between;align-items:center;margin:30px 0 10px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px}
.seg label{font-size:13px;font-weight:600;color:var(--muted);padding:5px 11px;border-radius:8px;cursor:pointer}
.seg input{display:none}
.seg input:checked+label{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
ul{list-style:none}
li{display:grid;grid-template-columns:40px 1fr 64px 92px;align-items:center;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.flag{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:22px}
.code{font-weight:600}
.name{font-size:13px;color:var(--muted)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.num b{display:block;font-weight:600}
.up{color:var(--green);font-size:13px}
.dn{color:var(--red);font-size:13px}
</style>
</head>
<body>
<header>
  <div class="logo">rateboard</div>
  <div class="upd"><b>●</b> Updated 2m ago</div>
</header>
<main>
  <div class="card">
    <div class="field">
      <div><label for="send">You send</label><input id="send" inputmode="decimal" value="100"></div>
      <button class="cur" aria-label="Change send currency"><span>🇦🇺</span>AUD <i>▾</i></button>
    </div>
    <button class="swap" aria-label="Swap currencies">⇅</button>
    <div class="field">
      <div><label for="get">They get</label><input id="get" inputmode="decimal" value="70.31"></div>
      <button class="cur" aria-label="Change receive currency"><span>🇺🇸</span>USD <i>▾</i></button>
    </div>
  </div>
  <p class="meta"><strong>1 AUD = 0.7031 USD</strong>Mid-market rate · banks add a margin · Rate date 31 Oct 2026</p>
  <div class="actions">
    <button class="btn primary">Copy</button>
    <button class="btn ghost">＋ Watch USD</button>
  </div>

  <div class="wl">
    <h2>Your watchlist</h2>
    <div class="seg" role="radiogroup" aria-label="Range">
      <input type="radio" name="r" id="r7" checked><label for="r7">7D</label>
      <input type="radio" name="r" id="r30"><label for="r30">30D</label>
      <input type="radio" name="r" id="r90"><label for="r90">90D</label>
    </div>
  </div>
  <ul>
    <li>
      <div class="flag">🇪🇺</div>
      <div><div class="code">EUR</div><div class="name">Euro</div></div>
      <svg width="64" height="24" viewBox="0 0 64 24" aria-hidden="true"><polyline fill="none" stroke="#16855f" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" points="1,19 9,17 17,18 25,13 33,14 41,9 49,10 57,6 63,4"/></svg>
      <div class="num"><b>0.6295</b><span class="up">▲ +2.21%</span></div>
    </li>
    <li>
      <div class="flag">🇬🇧</div>
      <div><div class="code">GBP</div><div class="name">British pound</div></div>
      <svg width="64" height="24" viewBox="0 0 64 24" aria-hidden="true"><polyline fill="none" stroke="#c8423b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" points="1,10 9,9 17,12 25,11 33,13 41,12 49,14 57,13 63,15"/></svg>
      <div class="num"><b>0.5247</b><span class="dn">▼ −0.18%</span></div>
    </li>
    <li>
      <div class="flag">🇯🇵</div>
      <div><div class="code">JPY</div><div class="name">Japanese yen</div></div>
      <svg width="64" height="24" viewBox="0 0 64 24" aria-hidden="true"><polyline fill="none" stroke="#16855f" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" points="1,16 9,15 17,17 25,13 33,14 41,12 49,13 57,10 63,9"/></svg>
      <div class="num"><b>107.4</b><span class="up">▲ +0.9%</span></div>
    </li>
  </ul>
</main>
</body>
</html>
