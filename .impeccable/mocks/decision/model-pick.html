<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Rateboard · Boarding Pass</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f1d2c;--mut:#4a5968;--line:#d5dde5;--ground:#e6ecf1;--up:#16855f;--down:#c8423b}
*{box-sizing:border-box;margin:0}
html,body{width:390px;height:844px;overflow:hidden;background:var(--ground);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 12px}
.brand{font-weight:700;font-size:20px;letter-spacing:-.02em}
.live{font-size:12px;color:var(--mut)}.live b{color:var(--up)}
.pass{margin:0 16px;background:#fff;border-radius:14px;box-shadow:0 1px 0 #c9d3dc,0 8px 24px -14px rgba(15,29,44,.35);position:relative}
.lbl{font-size:11px;letter-spacing:.14em;font-weight:500;color:var(--mut);text-transform:uppercase}
.route{display:grid;grid-template-columns:1fr 44px 1fr;align-items:end;padding:18px 18px 8px}
.code{display:block;background:none;border:0;padding:0;font:700 56px/1 "Space Grotesk";letter-spacing:-.03em;color:var(--ink);cursor:pointer;text-align:left}
.to .code{text-align:right}.to{text-align:right}
.code small{font-size:13px;font-weight:500;color:var(--mut);letter-spacing:0;display:block;margin-top:4px}
.flag{font-size:15px;margin-right:4px}
.swap{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;font-size:18px;margin:0 auto 22px;cursor:pointer;color:var(--ink)}
.fields{display:grid;grid-template-columns:1.1fr 1fr;gap:12px 14px;padding:10px 18px 16px;border-top:1px dashed var(--line);margin:0 18px;padding-left:0;padding-right:0}
.fields input{width:100%;font:700 22px "JetBrains Mono";border:0;border-bottom:2px solid var(--ink);padding:4px 0;color:var(--ink);background:none;outline:none}
.val{font:500 15px "JetBrains Mono";margin-top:6px}
.perf{position:relative;height:18px}
.perf:before{content:"";position:absolute;left:14px;right:14px;top:50%;border-top:2px dotted #b9c5d0}
.perf i{position:absolute;top:0;width:18px;height:18px;border-radius:50%;background:var(--ground)}
.perf i:first-child{left:-9px}.perf i:last-child{right:-9px}
.stub{padding:8px 18px 16px;display:flex;justify-content:space-between;align-items:end}
.result{font:700 40px/1.05 "JetBrains Mono";letter-spacing:-.04em}
.copy{border:0;background:var(--ink);color:#fff;font:500 13px "Space Grotesk";padding:10px 16px;border-radius:999px;cursor:pointer}
.note{font-size:12px;color:var(--mut);margin-top:6px}
h2{font-size:15px;font-weight:700}
.wh{display:flex;justify-content:space-between;align-items:center;padding:22px 20px 10px}
.seg{display:flex;background:#d6dee6;border-radius:8px;padding:2px}
.seg button{border:0;background:none;font:500 12px "JetBrains Mono";padding:5px 9px;border-radius:6px;color:var(--mut)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.row{display:grid;grid-template-columns:64px 1fr 70px 76px;align-items:center;margin:0 16px 8px;background:#fff;border-radius:10px;height:58px;position:relative;overflow:hidden}
.row .c{font:700 20px "Space Grotesk";padding-left:14px;border-right:2px dotted #c4ced8;height:100%;display:flex;align-items:center}
.row .c span{font-size:12px;margin-left:3px}
.row .r{font:500 15px "JetBrains Mono";padding-left:12px}
.row .r small{display:block;font:10px "Space Grotesk";letter-spacing:.12em;color:var(--mut)}
.chg{font:700 12px "JetBrains Mono";text-align:right;padding-right:14px}
.up{color:var(--up)}.down{color:var(--down)}
</style></head>
<body>
<header><div class="brand">rateboard</div><div class="live"><b>●</b> Updated 2m ago</div></header>

<section class="pass" aria-label="Converter">
  <div class="route">
    <div><div class="lbl">From</div><button class="code" aria-label="Change from currency">AUD<small><span class="flag">🇦🇺</span>Australian dollar ▾</small></button></div>
    <button class="swap" aria-label="Swap currencies">⇄</button>
    <div class="to"><div class="lbl">To</div><button class="code" aria-label="Change to currency">USD<small><span class="flag">🇺🇸</span>US dollar ▾</small></button></div>
  </div>
  <div class="fields">
    <label><span class="lbl">Amount · AUD</span><input class="mono" inputmode="decimal" value="100"></label>
    <div><div class="lbl">Rate</div><div class="val">1 AUD = 0.7031</div></div>
    <div><div class="lbl">Rate date</div><div class="val">31 Oct 2026</div></div>
    <div><div class="lbl">Source</div><div class="val">ExchangeRate-API</div></div>
  </div>
  <div class="perf"><i></i><i></i></div>
  <div class="stub">
    <div><div class="lbl">You get</div><div class="result">US$70.31</div></div>
    <button class="copy">Copy</button>
  </div>
  <div style="padding:0 18px 14px"><p class="note">Mid-market rate · banks add a margin</p><p class="note" style="margin-top:2px">Rate date 31 Oct 2026 · ExchangeRate-API</p></div>
</section>

<div class="wh"><h2>Your watchlist</h2>
  <div class="seg" role="group" aria-label="Period"><button aria-pressed="true">7D</button><button aria-pressed="false">30D</button><button aria-pressed="false">90D</button></div>
</div>

<div class="row"><div class="c">EUR<span>🇪🇺</span></div><div class="r">0.6295<small>PER AUD</small></div>
  <svg width="64" height="24" viewBox="0 0 64 24"><polyline fill="none" stroke="#16855f" stroke-width="1.8" points="0,19 9,17 18,18 27,13 36,14 45,9 54,7 64,4"/></svg>
  <div class="chg up">▲ +2.21%</div></div>
<div class="row"><div class="c">GBP<span>🇬🇧</span></div><div class="r">0.5247<small>PER AUD</small></div>
  <svg width="64" height="24" viewBox="0 0 64 24"><polyline fill="none" stroke="#c8423b" stroke-width="1.8" points="0,9 9,8 18,11 27,10 36,12 45,11 54,13 64,13"/></svg>
  <div class="chg down">▼ −0.18%</div></div>
<div class="row"><div class="c">JPY<span>🇯🇵</span></div><div class="r">107.4<small>PER AUD</small></div>
  <svg width="64" height="24" viewBox="0 0 64 24"><polyline fill="none" stroke="#16855f" stroke-width="1.8" points="0,16 9,15 18,17 27,14 36,12 45,13 54,10 64,9"/></svg>
  <div class="chg up">▲ +0.9%</div></div>
</body></html>
